{% extends 'dashboard/index.html' %}
{% load static %}

{% block content %}
<div class=" mt-4 m-auto" style="margin: auto;">
    <div class="card shadow-lg p-4"  style="width: 1000px !important;">
        <h3 class="mb-4 text-primary"><i class="fas fa-box"></i> Product Management</h3>
        <hr>

        <!-- Table -->
        <table id="productsTable" class="table table-striped table-hover">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Type</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>
{% endblock content %}

{% block script %}
<script>
    $(document).ready(function() {
        $('#productsTable').DataTable({
            ajax: "{% url 'product_list_api' %}",
            columns: [
                { data: "id" },
                {
                    data: "image",
                    render: function(data) {
                        return `<img src="${data}" alt="Product Image" class="rounded" width="50">`;
                    }
                },
                { data: "name" },
                { data: "categories" },
                { data: "price" },
                { data: "stock" },
                { data: "productType" },
                {
                    data: "uid",
                    render: function(data) {
                        return `
                            <div style="display:flex;gap:10px;">
                                <a href="/dashboard/product/${data}/" class="btn btn-sm btn-primary"><i class="fas fa-eye"></i></a>
                                <a href="/dashboard/edit-product/${data}/" class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></a>
                                <button class="btn btn-sm btn-danger delete-product" data-id="${data}"><i class="fas fa-trash"></i></button>
                            </div>

                        `;
                    }
                }
            ]
        });

        // Handle Delete Product
        $('#productsTable').on('click', '.delete-product', function() {
            let productId = $(this).data('id');
            if (confirm('Are you sure you want to delete this product?')) {
                $.ajax({
                    url: `/dashboard/delete_product/${productId}/`,
                    method: 'DELETE',
                    headers: { "X-CSRFToken": "{{ csrf_token }}" },
                    success: function(response) {
                        alert(response.message);
                        $('#productsTable').DataTable().ajax.reload();
                    },
                    error: function(error) {
                        alert('Error deleting product');
                    }
                });
            }
        });
    });
</script>
{% endblock script %}
