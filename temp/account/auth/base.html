{% load static %}
<!doctype html>
<html class="no-js" lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Account{% endblock title %} | LOT Store</title>
    <meta name="description" content="Sign in or create your LOT Store account to shop faith-inspired apparel from Layers of Truth Church.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#282a36">
    <link rel="icon" href="{% static 'home/img/logo/4.png' %}" type="image/png">
    <link rel="apple-touch-icon" href="{% static 'home/img/logo/4.png' %}">

    <!-- project css file  -->
    <link rel="stylesheet" href="{% static 'assets/css/my-task.style.min.css' %}">
    <link rel="preload" href="{% static 'home/fonts/poppins-400.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{% static 'home/css/brand.css' %}">
    <link rel="stylesheet" href="{% static 'fontawesomefree/css/fontawesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'fontawesomefree/css/solid.min.css' %}">
    <link rel="stylesheet" href="{% static 'fontawesomefree/css/v4-shims.min.css' %}">
    <style>
        /* Match the storefront: dark surfaces, Poppins, gold actions. */
        body, #mytask-layout, #mytask-layout .main {
            background: var(--lot-bg) !important;
            color: var(--lot-text);
            font-family: var(--lot-font);
        }
        #mytask-layout h1, #mytask-layout h2, #mytask-layout h5, #mytask-layout h6,
        #mytask-layout .color-900 { color: var(--lot-text) !important; font-family: var(--lot-font); }
        #mytask-layout .color-600, #mytask-layout .text-muted { color: var(--lot-text-muted) !important; }
        #mytask-layout .card.bg-dark {
            background: var(--lot-surface) !important;
            border: 1px solid var(--lot-border) !important;
            border-radius: 12px;
        }
        #mytask-layout a, #mytask-layout a.text-secondary { color: var(--lot-gold) !important; }
        #mytask-layout form .btn[type=submit] {
            background: var(--lot-gold) !important;
            color: var(--lot-ink) !important;
            border: none;
            font-weight: 600;
            width: 100%;
            text-transform: none;
        }
        #mytask-layout form .btn[type=submit]:hover { background: var(--lot-gold-dark) !important; }
        #mytask-layout .form-control, #mytask-layout .form-select {
            background-color: #fff;
            color: var(--lot-ink);
            border: 1px solid transparent;
        }
        #mytask-layout .form-control:focus, #mytask-layout .form-select:focus {
            border-color: var(--lot-gold);
            box-shadow: 0 0 0 3px rgba(205, 171, 75, 0.35);
        }
        .lot-back { display: inline-flex; gap: 6px; align-items: center; font-size: 0.9rem; }
        .phone{
                display: none;
            }
        @media screen and (max-width:960px) {
            .phone{
                display: block;
            }
            .main{
                display: flex;
                align-items: center;
            }
        }
        @media screen and (min-width:960px) {
            .phone{
                display: none;
            }
        }
        .form-text{
            display: none;
        }
    </style>
</head>

<body>

<div id="mytask-layout" class="theme-indigo">
    <div style="padding: 16px 20px;">
        <a href="{% url 'homepage' %}" class="lot-back"><i class="fa fa-arrow-left"></i> Back to LOT Store</a>
    </div>

    <!-- main body area -->
    <div class="main p-2 py-3 p-xl-5 " style="display: flex;justify-content: center;align-items: center;">
        
        <!-- Body: Body -->
        {% if messages %}
        <div style="position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 50; width: min(520px, calc(100% - 32px));">
            {% for message in messages %}
            <div role="status" style="margin-bottom: 8px; padding: 12px 16px; border-radius: 12px; background: var(--lot-gold); color: var(--lot-ink); font-weight: 500; box-shadow: 0 12px 30px rgba(0,0,0,0.35);">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% block main %}
        
        {% endblock main %}
    </div>
</div>

<!-- Jquery Core Js -->
<script src="{% static 'assets/bundles/libscripts.bundle.js' %}"></script>

</body>
