{% extends "account/auth/base.html" %}
{% block title %}Password reset complete{% endblock title %}
{% load static %}
{% load crispy_forms_tags %}
{% block main %}
<div class="body d-flex p-0">
    <div class="container-xxl d-flex justify-content-center align-items-center auth-h100">
        <div class="w-100 p-3 p-md-5 card border-0 bg-dark text-light" style="max-width: 32rem;">
            <div class="text-center mb-4">
                <a href="/"><img style="width:4rem;" src="{% static 'img/lot_logo.png' %}" alt="LOT Store"></a>
                <h1 class="h3 mt-3">Password updated</h1>
            </div>
            <p>Your password has been set. You can now sign in.</p>
            <a href="{% url 'login' %}" class="btn btn-lg btn-light w-100 mt-3">Sign in</a>
        </div>
    </div>
</div>
{% endblock main %}
