{# Usage: {% include "partials/checkout_steps.html" with step=1 %}  (1 cart, 2 details, 3 payment, 4 done) #}
<ol class="lot-steps" aria-label="Checkout progress">
    <li class="{% if step > 1 %}is-done{% elif step == 1 %}is-current{% endif %}"{% if step == 1 %} aria-current="step"{% endif %}><span>Cart</span></li>
    <li class="{% if step > 2 %}is-done{% elif step == 2 %}is-current{% endif %}"{% if step == 2 %} aria-current="step"{% endif %}><span>Delivery details</span></li>
    <li class="{% if step > 3 %}is-done{% elif step == 3 %}is-current{% endif %}"{% if step == 3 %} aria-current="step"{% endif %}><span>Payment</span></li>
</ol>
