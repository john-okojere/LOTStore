# LOT Store - store.layersoftruth.org
# Cloudflare Tunnel -> 127.0.0.1:8167 (nginx) -> 127.0.0.1:8067 (gunicorn).
# Proxy headers (incl. X-Forwarded-Proto https) are set at http level in local-django-apps.conf.
server {
    listen 127.0.0.1:8167;
    server_name store.layersoftruth.org;

    # Product and profile image uploads.
    client_max_body_size 10m;

    location /static/ {
        alias /mnt/storage/static/lot-store/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /media/ {
        alias /mnt/storage/media/lot-store/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:8067;
    }
}
